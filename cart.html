<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - Online Book Store</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f8f9fa;
}

.book-img{
    width:80px;
    height:100px;
    object-fit:cover;
    border-radius:5px;
}

.cart-table{
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.summary-box{
    background:white;
    padding:20px;
    border-radius:10px;
}

</style>

</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand fw-bold fs-3" href="#">
    <span class="text-warning">Book</span>
    <span class="text-white">Verse</span>
</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="index.html">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="catalogue.html">Catalogue</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="cart.html">Cart</a>
</li>

<li class="nav-item">
<a class="nav-link" href="about.html">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="contact.html">Contact</a>
</li>

</ul>

</div>

</div>
</nav>

<!-- Cart Section -->

<div class="container my-5">

<h2 class="mb-4 text-center">
Shopping Cart
</h2>

<div class="row">

<!-- Cart Items -->

<div class="col-lg-8">

<div class="table-responsive cart-table shadow">

<table class="table align-middle mb-0">

<thead class="table-dark">

<tr>
<th>Book</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Action</th>
</tr>

</thead>

<tbody>

<tr id="row1">

<td>
Java Programming
</td>

<td>
₹499
</td>

<td>

<input
type="number"
value="1"
min="1"
class="form-control quantity"
data-price="499">

</td>

<td class="itemTotal">
₹499
</td>

<td>

<button
class="btn btn-danger removeBtn">

Remove

</button>

</td>

</tr>

<tr id="row2">

<td>
Web Development
</td>

<td>
₹599
</td>

<td>

<input
type="number"
value="1"
min="1"
class="form-control quantity"
data-price="599">

</td>

<td class="itemTotal">
₹599
</td>

<td>

<button
class="btn btn-danger removeBtn">

Remove

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- Order Summary -->

<div class="col-lg-4">

<div class="summary-box shadow">

<h4>
Order Summary
</h4>

<hr>

<p>
Items:
<span id="itemsCount">
2
</span>
</p>

<h5>
Grand Total:
₹<span id="grandTotal">
1098
</span>
</h5>

<hr>

<a
href="checkout.html"
class="btn btn-success w-100">

Proceed To Checkout

</a>

</div>

</div>

</div>

</div>

<script>

function updateCart(){

let quantities =
document.querySelectorAll(".quantity");

let totals =
document.querySelectorAll(".itemTotal");

let grandTotal = 0;

quantities.forEach((input,index)=>{

let price =
parseInt(input.dataset.price);

let qty =
parseInt(input.value);

let total =
price * qty;

totals[index].innerText =
"₹" + total;

grandTotal += total;

});

document.getElementById("grandTotal")
.innerText = grandTotal;

}

document
.querySelectorAll(".quantity")
.forEach(input=>{

input.addEventListener(
"input",
updateCart
);

});

document
.querySelectorAll(".removeBtn")
.forEach(button=>{

button.addEventListener("click",function(){

this.closest("tr").remove();

document.getElementById("itemsCount")
.innerText =
document.querySelectorAll("tbody tr").length;

updateCart();

});

});

updateCart();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
